<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
// GitHub Pages SPA redirect - sends all 404s back to index with the path preserved in hash
const path = window.location.pathname + window.location.search;
window.location.replace(window.location.origin + '/#' + path);
</script>
</head>
<body></body>
</html>
