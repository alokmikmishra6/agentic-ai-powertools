<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7b6cf0"/>
      <stop offset="50%" stop-color="#22d3c8"/>
      <stop offset="100%" stop-color="#e879a0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="40" x2="40" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7b6cf0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3c8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Outer hexagonal frame -->
  <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" stroke="url(#g1)" stroke-width="1.2" fill="none" opacity="0.5"/>
  <!-- Inner structure — A -->
  <path d="M10,30 L16,10 L20,20 L24,10 L30,30" stroke="url(#g1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- A crossbar -->
  <line x1="13" y1="22" x2="20" y2="22" stroke="url(#g1)" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <!-- M middle -->
  <line x1="27" y1="22" x2="20" y2="22" stroke="url(#g1)" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <!-- Node dots at vertices -->
  <circle cx="10" cy="30" r="1.8" fill="url(#g1)"/>
  <circle cx="16" cy="10" r="1.8" fill="url(#g1)"/>
  <circle cx="20" cy="20" r="2" fill="url(#g1)"/>
  <circle cx="24" cy="10" r="1.8" fill="url(#g1)"/>
  <circle cx="30" cy="30" r="1.8" fill="url(#g1)"/>
  <!-- Glow at center node -->
  <circle cx="20" cy="20" r="5" fill="url(#g1)" opacity="0.1"/>
  <!-- Orbital ring -->
  <ellipse cx="20" cy="20" rx="14" ry="6" stroke="url(#g2)" stroke-width="0.6" fill="none" transform="rotate(-25 20 20)"/>
</svg>
