name: Notify Subscribers on New Content

on:
  push:
    branches: [main]
    paths:
      - 'src/data/content.js'
  workflow_dispatch:
    inputs:
      test_slug:
        description: 'Article slug to test with (e.g. token-economy-agentic-systems)'
        required: false
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect new articles
        id: detect
        run: |
          # Manual trigger with test slug
          TEST_SLUG="${{ github.event.inputs.test_slug }}"
          if [ -n "$TEST_SLUG" ]; then
            echo "Manual trigger with slug: $TEST_SLUG"
            echo "has_new=true" >> $GITHUB_OUTPUT
            echo "slugs<<EOF" >> $GITHUB_OUTPUT
            echo "$TEST_SLUG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Compare the full push range (handles multi-commit pushes)
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          
          echo "Comparing $BEFORE..$AFTER"
          
          # Get the diff for content.js across the entire push
          DIFF=$(git diff "$BEFORE" "$AFTER" -- src/data/content.js 2>/dev/null || git diff HEAD~1 HEAD -- src/data/content.js || true)
          
          echo "--- Diff output (first 50 lines) ---"
          echo "$DIFF" | head -50
          echo "--- End diff ---"
          
          # Extract new slugs: lines added (start with +) containing 'slug:'
          NEW_SLUGS=$(echo "$DIFF" | grep '^+' | grep -v '^+++' | grep 'slug:' | sed 's/.*slug:[[:space:]]*"\([^"]*\)".*/\1/' || true)
          
          echo "Detected slugs: [$NEW_SLUGS]"
          
          if [ -z "$NEW_SLUGS" ]; then
            echo "No new articles detected."
            echo "has_new=false" >> $GITHUB_OUTPUT
          else
            echo "New articles found: $NEW_SLUGS"
            echo "has_new=true" >> $GITHUB_OUTPUT
            echo "slugs<<EOF" >> $GITHUB_OUTPUT
            echo "$NEW_SLUGS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Send newsletter email
        if: steps.detect.outputs.has_new == 'true'
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SITE_URL: https://alokmishra.github.io/agentic-ai-powertools
        run: |
          SLUGS="${{ steps.detect.outputs.slugs }}"
          
          echo "Processing slugs: $SLUGS"
          
          # Build email body in markdown
          BODY="Hey there,"$'\n\n'"I just published new writing:"$'\n\n'
          
          for SLUG in $SLUGS; do
            # Extract title (handle indentation with flexible whitespace matching)
            TITLE=$(grep -A2 "slug: \"$SLUG\"" src/data/content.js | grep "title:" | head -1 | sed 's/.*title:[[:space:]]*"\(.*\)",\{0,1\}$/\1/' || echo "$SLUG")
            EXCERPT=$(grep -A10 "slug: \"$SLUG\"" src/data/content.js | grep "excerpt:" | head -1 | sed 's/.*excerpt:[[:space:]]*"\(.*\)",\{0,1\}$/\1/' || echo "")
            
            echo "Found article: $TITLE"
            
            BODY="${BODY}**[${TITLE}](${SITE_URL}/#/writing/${SLUG})**"$'\n'
            if [ -n "$EXCERPT" ]; then
              BODY="${BODY}${EXCERPT}"$'\n'
            fi
            BODY="${BODY}"$'\n'
          done
          
          BODY="${BODY}---"$'\n\n'"As always — no fluff, just signal."$'\n\n'"— Alok"
          
          # Build subject line
          COUNT=$(echo "$SLUGS" | wc -w | tr -d ' ')
          if [ "$COUNT" -gt 1 ]; then
            SUBJECT="$COUNT new essays just dropped"
          else
            FIRST_SLUG=$(echo "$SLUGS" | head -1 | tr -d '[:space:]')
            TITLE=$(grep -A2 "slug: \"$FIRST_SLUG\"" src/data/content.js | grep "title:" | head -1 | sed 's/.*title:[[:space:]]*"\(.*\)",\{0,1\}$/\1/' || echo "New post")
            SUBJECT="New: $TITLE"
          fi
          
          echo "Subject: $SUBJECT"
          echo "Body preview: $(echo "$BODY" | head -5)"
          
          # Send via Buttondown API
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.buttondown.com/v1/emails" \
            -H "Authorization: Token $BUTTONDOWN_API_KEY" \
            -H "Content-Type: application/json" \
            -H "X-Buttondown-Live-Dangerously: true" \
            -d "$(jq -n \
              --arg subject "$SUBJECT" \
              --arg body "$BODY" \
              '{subject: $subject, body: $body, status: "about_to_send"}'
            )")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY_RESPONSE=$(echo "$RESPONSE" | sed '$d')
          
          echo "Buttondown response (HTTP $HTTP_CODE): $BODY_RESPONSE"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Newsletter sent successfully!"
          else
            echo "::error::Failed to send newsletter. HTTP $HTTP_CODE"
            exit 1
          fi
