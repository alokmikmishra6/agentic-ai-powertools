name: Check newsletter readiness
# Delivery is handled by the quota-aware Google Apps Script trigger after publishing.
# This check never sends email and does not call any paid newsletter API.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: test -s dist/updates.json
